[project]
name = "ai-job-application-agent"
version = "0.2.0"
description = "Fill job applications once: a local profile library, AI resume parsing and a browser extension that autofills application forms."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["extension*", "shared*", "data*", "docs*", "frontend*", "output*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
