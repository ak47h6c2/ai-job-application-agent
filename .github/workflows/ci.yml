name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests

  frontend:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/test/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm ci
        working-directory: extension/test
      - run: npx playwright-core install --with-deps chromium
        working-directory: extension/test
      - run: npm run typecheck
        working-directory: extension
      # Engine tests on real component libraries + end-to-end tests with the built extension and a live backend.
      - run: npm test
        working-directory: extension
        env:
          PYTHON: python
