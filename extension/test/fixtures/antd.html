<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>飞书招聘风格 - Ant Design</title>
<script src="/test/node_modules/react/umd/react.development.js"></script>
<script src="/test/node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="/test/node_modules/dayjs/dayjs.min.js"></script>
<script src="/test/node_modules/antd/dist/antd.js"></script>
<style>body{font-family:sans-serif;padding:20px;max-width:900px}.entry{border:1px solid #eee;padding:8px;margin:6px 0}</style></head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { Form, Input, Select, DatePicker, Cascader, Radio, Button, Typography } = antd;
const NATIONS = ["汉族","蒙古族","回族","藏族","维吾尔族","苗族","彝族","壮族","布依族","朝鲜族","满族","侗族","瑶族","白族","土家族","哈尼族","哈萨克族","傣族","黎族","傈僳族","佤族","畲族","高山族","拉祜族","水族","东乡族","纳西族","景颇族","柯尔克孜族","土族","达斡尔族","仫佬族","羌族","布朗族","撒拉族","毛南族","仡佬族","锡伯族","阿昌族","普米族","塔吉克族","怒族","乌孜别克族","俄罗斯族","鄂温克族","德昂族","保安族","裕固族","京族","塔塔尔族","独龙族","鄂伦春族","赫哲族","门巴族","珞巴族","基诺族"];
const REGIONS = [
  { value: "gd", label: "广东省", children: [{ value: "sz", label: "深圳市", children: [{ value: "ns", label: "南山区" }, { value: "ba", label: "宝安区" }] }] },
  { value: "zj", label: "浙江省", children: [{ value: "hz", label: "杭州市", children: [{ value: "xh", label: "西湖区" }] }] }
];
const serialize = (value) => {
  if (value && typeof value.format === "function") return value.format("YYYY-MM-DD");
  if (Array.isArray(value)) return value.map(serialize);
  if (value && typeof value === "object") return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, serialize(v)]));
  return value;
};
function App() {
  const [form] = Form.useForm();
  return h(Form, { form, layout: "vertical", initialValues: { education: [{}] }, onValuesChange: (_, all) => { window.__values = serialize(all); } },
    h(Typography.Title, { level: 4 }, "个人信息"),
    h(Form.Item, { label: "姓名", name: "name", rules: [{ required: true }] }, h(Input, { placeholder: "请输入" })),
    h(Form.Item, { label: "性别", name: "gender" }, h(Select, { placeholder: "请选择", options: [{ value: "1", label: "男" }, { value: "2", label: "女" }] })),
    h(Form.Item, { label: "出生日期", name: "birth" }, h(DatePicker, { placeholder: "请选择日期" })),
    h(Form.Item, { label: "民族", name: "nation" }, h(Select, { showSearch: true, placeholder: "请选择", options: NATIONS.map((n) => ({ value: n, label: n })) })),
    h(Form.Item, { label: "政治面貌", name: "political" }, h(Select, { placeholder: "请选择", options: ["中共党员","中共预备党员","共青团员","民革会员","民盟盟员","无党派人士","群众","其他"].map((n) => ({ value: n, label: n })) })),
    h(Form.Item, { label: "手机号", name: "phone" }, h(Input, null)),
    h(Form.Item, { label: "籍贯", name: "hometown" }, h(Cascader, { options: REGIONS, placeholder: "请选择" })),
    h(Form.Item, { label: "是否应届生", name: "fresh" }, h(Radio.Group, { options: [{ value: "Y", label: "是" }, { value: "N", label: "否" }] })),
    h(Typography.Title, { level: 4 }, "教育经历"),
    h(Form.List, { name: "education" }, (fields, { add }) => h(React.Fragment, null,
      fields.map((field) => h("div", { key: field.key, className: "entry" },
        h(Form.Item, { label: "学校名称", name: [field.name, "school"] }, h(Input, null)),
        h(Form.Item, { label: "学历", name: [field.name, "degree"] }, h(Select, { options: ["本科", "硕士研究生", "博士研究生"].map((n) => ({ value: n, label: n })) })),
        h(Form.Item, { label: "在读时间", name: [field.name, "range"] }, h(DatePicker.RangePicker, { picker: "month" }))
      )),
      h(Button, { type: "dashed", onClick: () => add() }, "+ 添加教育经历")
    )),
    h(Typography.Title, { level: 4 }, "语言能力"),
    h(Form.Item, { label: "语种", name: "language" }, h(Select, { options: ["英语", "日语", "韩语"].map((n) => ({ value: n, label: n })) })),
    h(Form.Item, { label: "证书/等级", name: "level" }, h(Input, null))
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body></html>
