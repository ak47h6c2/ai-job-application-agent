<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>校招简历</title>
<style>body{font-family:sans-serif;padding:20px;max-width:900px}.card{border:1px solid #eee;padding:12px;margin:8px 0}.head{display:flex;justify-content:space-between}.form-item{margin:6px 0}</style></head>
<body>
<h2>校招简历</h2>
<p>简历完成度达到100%，才可以进行正式投递哦</p>
<section id="basic">
  <div class="head"><h3>个人基本信息</h3><a href="javascript:;" class="edit" id="edit-basic"><i class="icon"></i><span>编辑</span></a></div>
  <div class="card view">待完善</div>
  <form class="card form" hidden>
    <div class="form-item"><label>姓名</label><input id="name"></div>
    <div class="form-item"><label>手机号码</label><input id="phone"></div>
    <div class="form-item"><label>电子邮箱</label><input id="email"></div>
    <div class="form-item"><label>政治面貌</label><select id="political"><option value="">请选择</option><option>中共党员</option><option>共青团员</option><option>群众</option></select></div>
    <button type="button" id="save-basic">保存</button>
  </form>
</section>
<section id="edu">
  <div class="head"><h3>教育经历</h3><a href="javascript:;" class="edit"><span>添加</span></a></div>
</section>
<script>
document.getElementById("edit-basic").addEventListener("click", () => {
  document.querySelector("#basic .view").hidden = true;
  document.querySelector("#basic .form").hidden = false;
});
</script>
</body></html>
