<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>北森风格网申 - Element UI</title>
<link rel="stylesheet" href="/test/node_modules/element-ui/lib/theme-chalk/index.css">
<script src="/test/node_modules/vue2/dist/vue.js"></script>
<script src="/test/node_modules/element-ui/lib/index.js"></script>
<style>body{font-family:sans-serif;padding:20px;max-width:900px} .card{border:1px solid #eee;padding:8px;margin:6px 0}</style></head>
<body>
<div id="app">
  <div class="steps"><span class="active">基本信息</span> <span>教育经历</span> <span>实习经历</span> <span>家庭成员</span></div>
  <el-form label-width="120px" :model="form">
    <h3 class="section-title">个人信息</h3>
    <el-form-item label="姓名" required><el-input v-model="form.name" placeholder="请输入姓名"></el-input></el-form-item>
    <el-form-item label="性别"><el-select v-model="form.gender" placeholder="请选择"><el-option label="男" value="M"></el-option><el-option label="女" value="F"></el-option></el-select></el-form-item>
    <el-form-item label="出生日期"><el-date-picker v-model="form.birth" type="date" value-format="yyyy-MM-dd" placeholder="选择日期"></el-date-picker></el-form-item>
    <el-form-item label="政治面貌"><el-select v-model="form.political"><el-option v-for="o in politicals" :key="o" :label="o" :value="o"></el-option></el-select></el-form-item>
    <el-form-item label="民族"><el-select v-model="form.nation" filterable><el-option v-for="o in nations" :key="o" :label="o" :value="o"></el-option></el-select></el-form-item>
    <el-form-item label="手机号码"><el-input v-model="form.phone"></el-input></el-form-item>
    <el-form-item label="邮箱"><el-input v-model="form.email"></el-input></el-form-item>
    <el-form-item label="籍贯"><el-cascader v-model="form.hometown" :options="regions"></el-cascader></el-form-item>
    <el-form-item label="现居住城市"><el-cascader v-model="form.city" :options="regions"></el-cascader></el-form-item>
    <el-form-item label="是否接受调剂"><el-radio-group v-model="form.adjust"><el-radio label="是"></el-radio><el-radio label="否"></el-radio></el-radio-group></el-form-item>
    <el-form-item label="期望薪资"><el-input v-model="form.salary"></el-input></el-form-item>

    <h3 class="section-title">教育经历</h3>
    <div v-for="(edu, i) in form.education" :key="i" class="card">
      <el-form-item label="学校"><el-select v-model="edu.school" filterable remote :remote-method="searchSchool" placeholder="请输入学校名称搜索"><el-option v-for="s in schoolOptions" :key="s" :label="s" :value="s"></el-option></el-select></el-form-item>
      <el-form-item label="专业"><el-input v-model="edu.major"></el-input></el-form-item>
      <el-form-item label="学历"><el-select v-model="edu.degree"><el-option v-for="d in degrees" :key="d" :label="d" :value="d"></el-option></el-select></el-form-item>
      <el-form-item label="在校时间"><el-date-picker v-model="edu.range" type="monthrange" value-format="yyyy-MM" range-separator="至" start-placeholder="开始月份" end-placeholder="结束月份"></el-date-picker></el-form-item>
      <el-form-item label="学习形式"><el-radio-group v-model="edu.mode"><el-radio-button label="全日制"></el-radio-button><el-radio-button label="非全日制"></el-radio-button></el-radio-group></el-form-item>
    </div>
    <el-button type="text" icon="el-icon-plus" @click="form.education.push({school:'',major:'',degree:'',range:[],mode:''})">添加教育经历</el-button>

    <h3 class="section-title">实习经历</h3>
    <div v-for="(w, i) in form.work" :key="'w'+i" class="card saved">{{ w.company }} · {{ w.title }} · {{ w.start }} - {{ w.end || '至今' }}</div>
    <el-button size="small" @click="openWork">+ 新增</el-button>

    <h3 class="section-title">获奖情况</h3>
    <div v-for="(a, i) in form.awards" :key="'a'+i" class="card">
      <el-form-item label="奖项名称"><el-input v-model="a.name"></el-input></el-form-item>
      <el-form-item label="获奖时间"><el-date-picker v-model="a.date" type="month" value-format="yyyy-MM" placeholder="选择月份"></el-date-picker></el-form-item>
    </div>
  </el-form>

  <el-dialog title="添加实习经历" :visible.sync="dialog">
    <el-form label-width="100px">
      <el-form-item label="公司名称"><el-input v-model="draft.company"></el-input></el-form-item>
      <el-form-item label="职位名称"><el-input v-model="draft.title"></el-input></el-form-item>
      <el-form-item label="开始时间"><el-date-picker v-model="draft.start" type="month" value-format="yyyy-MM" placeholder="选择月份"></el-date-picker></el-form-item>
      <el-form-item label="结束时间"><el-date-picker v-model="draft.end" type="month" value-format="yyyy-MM" placeholder="选择月份" :disabled="draft.present"></el-date-picker> <el-checkbox v-model="draft.present">至今</el-checkbox></el-form-item>
      <el-form-item label="工作内容"><el-input type="textarea" v-model="draft.desc"></el-input></el-form-item>
    </el-form>
    <span slot="footer"><el-button @click="dialog=false">取 消</el-button><el-button type="primary" @click="saveWork">确 定</el-button></span>
  </el-dialog>
</div>
<script>
const SCHOOLS = ["北京大学", "北京大学医学部", "北京交通大学", "浙江大学", "浙江工业大学", "清华大学", "复旦大学"];
window.vm = new Vue({
  el: "#app",
  data: {
    form: { name: "", gender: "", birth: "", political: "", nation: "", phone: "", email: "", hometown: [], city: [], adjust: "", salary: "",
      education: [{ school: "", major: "", degree: "", range: [], mode: "" }], work: [], awards: [{ name: "", date: "" }] },
    politicals: ["中共党员", "中共预备党员", "共青团员", "群众"],
    nations: ["汉族","蒙古族","回族","藏族","维吾尔族","苗族","彝族","壮族","布依族","朝鲜族","满族","侗族","瑶族","白族","土家族","哈尼族","哈萨克族","傣族","黎族","傈僳族"],
    degrees: ["大专", "本科", "硕士研究生", "博士研究生"],
    schoolOptions: [],
    regions: [
      { value: "gd", label: "广东省", children: [ { value: "sz", label: "深圳市", children: [ { value: "ns", label: "南山区" }, { value: "ft", label: "福田区" } ] }, { value: "gz", label: "广州市", children: [ { value: "th", label: "天河区" } ] } ] },
      { value: "bj", label: "北京市", children: [ { value: "bjs", label: "市辖区", children: [ { value: "hd", label: "海淀区" }, { value: "cy", label: "朝阳区" } ] } ] }
    ],
    dialog: false,
    draft: {}
  },
  methods: {
    searchSchool(query) { setTimeout(() => { this.schoolOptions = SCHOOLS.filter((s) => s.includes(query)); }, 300); },
    openWork() { this.draft = { company: "", title: "", start: "", end: "", present: false, desc: "" }; this.dialog = true; },
    saveWork() { if (!this.draft.company) return; this.form.work.push(this.draft); this.dialog = false; }
  }
});
</script>
</body></html>
