<!doctype html><html lang="zh"><meta charset="utf-8"><title>奖励表单测试</title>
<style>body{font:16px sans-serif;padding:30px}aside{float:right}label{display:block;margin:15px 0 5px}input,select{width:380px;padding:12px}</style>
<main class="apply-module__body"><div><div class="form-content--title-box"><h6 class="form-content--title">奖励/荣誉 <span>必填</span></h6></div>
<p>奖学金、校内竞比赛、其他荣誉等都可以成为你简历中的亮点</p>
<form class="el-form scrd-web--form-edit">
<label for="has-award">是否获得过奖励/荣誉</label><select id="has-award"><option value="">请选择</option><option value="yes">是</option><option value="no">否</option></select>
<label for="award-name">名称</label><input id="award-name" placeholder="请填写名称">
<label for="award-type">类型</label><select id="award-type"><option value="">请选择类型</option><option>竞赛</option><option>奖学金</option><option>其他</option></select>
<label for="award-date">获取时间</label><input id="award-date" type="month">
<label for="award-description">详细描述</label><input id="award-description" placeholder="请填写详细描述">
<button type="button">添加</button><button type="button">取消</button>
</form></div></main>
<aside class="apply-resume-menu"><div class="resume-menu-item"><h6>教育经历</h6></div><div class="resume-menu-item"><h6>实习经历</h6></div><div class="resume-menu-item"><h6>科研项目或研究经历</h6></div><div class="resume-menu-item resume-menu-item--active"><h6>奖励/荣誉</h6></div><div class="resume-menu-item"><h6>家庭成员情况</h6></div></aside>
</html>
