<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>校招简历 - 某银行</title>
<link rel="stylesheet" href="/test/node_modules/element-ui/lib/theme-chalk/index.css">
<script src="/test/node_modules/vue2/dist/vue.js"></script>
<script src="/test/node_modules/element-ui/lib/index.js"></script>
<style>body{font-family:sans-serif;padding:20px;display:flex;gap:24px}.nav a{display:block;padding:6px}.main{flex:1;max-width:820px}.card{border:1px solid #eee;padding:8px;margin:6px 0}</style></head>
<body>
<div id="app" style="display:flex;gap:24px;width:100%">
  <div class="nav"><a>个人基本信息</a><a>教育经历</a><a>工作（实习）经历</a><a>荣誉或奖励</a><a>学术成果</a><a>资格认证</a><a>家庭关系</a><a>工作意向</a></div>
  <el-form class="main" label-width="160px">
    <h3>个人基本信息</h3>
    <el-form-item label="宗教信仰"><el-input v-model="f.religion"></el-input></el-form-item>
    <el-form-item label="计算机水平"><el-input v-model="f.computer"></el-input></el-form-item>
    <el-form-item label="是否有直系亲属在本行工作"><el-radio-group v-model="f.relatives"><el-radio label="是"></el-radio><el-radio label="否"></el-radio></el-radio-group></el-form-item>
    <el-form-item label="是否受过刑事处罚或纪律处分"><el-select v-model="f.criminal"><el-option label="是" value="1"></el-option><el-option label="否" value="0"></el-option></el-select></el-form-item>

    <h3>工作（实习）经历</h3>
    <div class="card" v-for="(w, i) in f.work" :key="i">
      <el-form-item label="单位名称"><el-input v-model="w.company"></el-input></el-form-item>
      <el-form-item label="职务"><el-input v-model="w.title"></el-input></el-form-item>
    </div>
    <el-button type="text" @click="f.work.push({ company: '', title: '' })">+ 添加</el-button>

    <h3>学术成果</h3>
    <div class="card">
      <el-form-item label="论文题目"><el-input v-model="f.paper.title"></el-input></el-form-item>
      <el-form-item label="发表期刊"><el-input v-model="f.paper.venue"></el-input></el-form-item>
      <el-form-item label="本人排名"><el-select v-model="f.paper.rank"><el-option v-for="r in ['第一作者','第二作者','第三作者及以后']" :key="r" :label="r" :value="r"></el-option></el-select></el-form-item>
      <el-form-item label="发表时间"><el-date-picker v-model="f.paper.date" type="month" value-format="yyyy-MM"></el-date-picker></el-form-item>
    </div>

    <h3>资格认证</h3>
    <div class="card">
      <el-form-item label="证书名称"><el-select v-model="f.cert" filterable><el-option v-for="c in ['大学英语四级','大学英语六级','全国计算机等级考试二级','其他']" :key="c" :label="c" :value="c"></el-option></el-select></el-form-item>
    </div>

    <h3>教育经历</h3>
    <div class="card">
      <el-form-item label="毕业院校"><el-select v-model="f.school" filterable><el-option v-for="s in ['清华大学','复旦大学','其他']" :key="s" :label="s" :value="s"></el-option></el-select></el-form-item>
    </div>

    <h3>工作意向</h3>
    <el-form-item label="意向机构"><el-select v-model="f.org"><el-option v-for="o in ['北京分行','上海分行','深圳分行']" :key="o" :label="o" :value="o"></el-option></el-select></el-form-item>
    <el-form-item label="意向岗位"><el-select v-model="f.jobs" multiple><el-option v-for="j in ['后端开发','前端开发','数据分析','产品经理']" :key="j" :label="j" :value="j"></el-option></el-select></el-form-item>
    <el-form-item label="意向工作城市"><el-checkbox-group v-model="f.cities"><el-checkbox label="北京"></el-checkbox><el-checkbox label="上海"></el-checkbox><el-checkbox label="深圳"></el-checkbox></el-checkbox-group></el-form-item>
    <el-form-item label="期望年薪（元）"><input type="number" id="salary" class="el-input__inner" style="width:200px"></el-form-item>
  </el-form>
</div>
<script>
window.vm = new Vue({
  el: "#app",
  data: { f: { religion: "", computer: "", relatives: "", criminal: "", work: [{ company: "", title: "" }], paper: { title: "", venue: "", rank: "", date: "" }, cert: "", school: "", org: "", jobs: [], cities: [] } }
});
</script>
</body></html>
