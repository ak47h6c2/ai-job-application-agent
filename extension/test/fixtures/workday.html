<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My Experience - Careers (Workday style)</title>
<style>body{font-family:sans-serif;padding:20px;max-width:800px} [role=listbox]{position:absolute;background:#fff;border:1px solid #999;list-style:none;margin:0;padding:0;z-index:10} [role=option]{padding:4px 8px} .block{border:1px solid #ddd;margin:8px 0;padding:8px} .date{display:inline-flex;gap:4px}</style></head>
<body>
<h2>My Information</h2>
<div data-automation-id="formField-legalNameSection_firstName"><label id="l-first">Legal First Name*</label><input aria-labelledby="l-first" id="first"></div>
<div data-automation-id="formField-legalNameSection_lastName"><label id="l-last">Legal Last Name*</label><input aria-labelledby="l-last" id="last"></div>
<div data-automation-id="formField-email"><label for="email">Email Address</label><input id="email" type="email"></div>
<div data-automation-id="formField-phone"><label for="phone">Phone Number</label><input id="phone" type="tel"></div>
<div data-automation-id="formField-source"><label id="l-source">How Did You Hear About Us?</label><button type="button" aria-haspopup="listbox" aria-labelledby="l-source" class="dd" data-options="LinkedIn|Seek|University Careers Fair|Referral" id="source">Select One</button></div>
<div data-automation-id="formField-salary"><label for="salary">What are your salary expectations?</label><input id="salary"></div>
<fieldset><legend>Are you legally entitled to work in Australia?</legend><label><input type="radio" name="rights" value="yes">Yes</label><label><input type="radio" name="rights" value="no">No</label></fieldset>
<fieldset><legend>Will you now or in the future require visa sponsorship?</legend><label><input type="radio" name="spons" value="yes">Yes</label><label><input type="radio" name="spons" value="no">No</label></fieldset>

<h2>Work Experience</h2>
<div id="work"></div>
<button type="button" data-automation-id="add-button" aria-label="Add Work Experience" id="add-work">Add</button>

<h2>Education</h2>
<div id="edu"></div>
<button type="button" data-automation-id="add-button" aria-label="Add Education" id="add-edu">Add</button>

<h2>Resume/CV</h2>
<div data-automation-id="formField-resume"><label for="cv">Upload a file (resume)</label><input type="file" id="cv" style="display:none"><button type="button" onclick="cv.click()">Select files</button></div>
<label><input type="checkbox" id="terms"> I agree to the terms</label>

<template id="work-tpl"><div class="block work">
  <div data-automation-id="formField-jobTitle"><label>Job Title*</label><input class="title"></div>
  <div data-automation-id="formField-company"><label>Company</label><input class="company"></div>
  <div data-automation-id="formField-location"><label>Location</label><input class="location"></div>
  <div data-automation-id="formField-currentlyWorkHere"><label><input type="checkbox" class="current"> I currently work here</label></div>
  <div data-automation-id="formField-startDate"><label>From*</label><div class="date"><input class="from-m" placeholder="MM" aria-label="Month" data-automation-id="dateSectionMonth-input"><input class="from-y" placeholder="YYYY" aria-label="Year" data-automation-id="dateSectionYear-input"></div></div>
  <div data-automation-id="formField-endDate"><label>To*</label><div class="date"><input class="to-m" placeholder="MM" aria-label="Month" data-automation-id="dateSectionMonth-input"><input class="to-y" placeholder="YYYY" aria-label="Year" data-automation-id="dateSectionYear-input"></div></div>
  <div data-automation-id="formField-roleDescription"><label>Role Description</label><textarea class="desc"></textarea></div>
</div></template>
<template id="edu-tpl"><div class="block edu">
  <div data-automation-id="formField-school"><label>School or University*</label><input class="school"></div>
  <div data-automation-id="formField-degree"><label class="deg-label">Degree*</label><button type="button" aria-haspopup="listbox" class="dd degree" data-options="Bachelor's Degree|Master's Degree|Doctorate (PhD)|Diploma">Select One</button></div>
  <div data-automation-id="formField-fieldOfStudy"><label>Field of Study</label><input class="major"></div>
  <div data-automation-id="formField-gpa"><label>Overall Result (GPA)</label><input class="gpa"></div>
</div></template>
<script>
function wireDropdown(button) {
  if (button.dataset.wired) return;
  button.dataset.wired = "1";
  button.addEventListener("click", () => {
    document.querySelectorAll("[role=listbox]").forEach((list) => list.remove());
    const list = document.createElement("ul");
    list.setAttribute("role", "listbox");
    const rect = button.getBoundingClientRect();
    list.style.left = rect.left + "px";
    list.style.top = rect.bottom + window.scrollY + "px";
    button.dataset.options.split("|").forEach((text) => {
      const item = document.createElement("li");
      item.setAttribute("role", "option");
      item.textContent = text;
      item.addEventListener("click", () => { button.textContent = text; button.dataset.value = text; list.remove(); });
      list.appendChild(item);
    });
    document.body.appendChild(list);
  });
}
document.querySelectorAll(".dd").forEach(wireDropdown);
const addBlock = (tpl, target) => { document.getElementById(target).appendChild(document.getElementById(tpl).content.cloneNode(true)); document.querySelectorAll(".dd").forEach(wireDropdown); };
document.getElementById("add-work").onclick = () => addBlock("work-tpl", "work");
document.getElementById("add-edu").onclick = () => addBlock("edu-tpl", "edu");
</script>
</body></html>
